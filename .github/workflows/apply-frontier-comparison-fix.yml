name: Apply frontier comparison fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/frontier-missing-comparisons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply reviewed edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str) -> str:
              assert text.count(old) == 1, (old, text.count(old))
              return text.replace(old, new, 1)

          component_path = Path('web/src/components/BenchTab.tsx')
          component = component_path.read_text()

          component = replace_once(
              component,
              "  if (comparison?.verdict === 'credible' && comparison.mean_delta > 0) {\n",
              "  if (!comparison) {\n"
              "    return { text: 'insufficient data', color: FALLBACK_COLOR }\n"
              "  }\n"
              "  if (comparison.verdict === 'credible' && comparison.mean_delta > 0) {\n",
          )
          component = replace_once(
              component,
              "  if (comparison?.verdict === 'credible' && comparison.mean_delta < 0) {\n",
              "  if (comparison.verdict === 'credible' && comparison.mean_delta < 0) {\n",
          )
          frontier_line = "  const frontierRows = rows.filter(([, arm]) => arm.family?.includes('frontier'))\n"
          component = replace_once(
              component,
              frontier_line,
              frontier_line
              + "  const missingComparisons = rows.filter(([model]) => !comparisons.has(model)).length\n"
              + "  const hasCompleteComparisons = missingComparisons === 0\n",
          )
          component = replace_once(
              component,
              "    return comparison?.verdict !== 'credible'\n",
              "    return comparison != null && comparison.verdict !== 'credible'\n",
          )
          component = replace_once(
              component,
              "              No solo model beats the coordinated Qwen society on lives.\n",
              "              {hasCompleteComparisons\n"
              "                ? 'No solo model beats the coordinated Qwen society on lives.'\n"
              "                : 'Some solo models lack a paired comparison.'}\n",
          )
          component = replace_once(
              component,
              "              Frontier solos reach the same outcome ceiling, but most pay substantially more.\n"
              "              DeepSeek V4 Flash is the honest exception: it ties on lives and costs less.\n",
              "              {hasCompleteComparisons ? (\n"
              "                <>\n"
              "                  Frontier solos reach the same outcome ceiling, but most pay substantially more.\n"
              "                  DeepSeek V4 Flash is the honest exception: it ties on lives and costs less.\n"
              "                </>\n"
              "              ) : (\n"
              "                <>\n"
              "                  Rows without shared seeds are marked insufficient data and excluded from the tie\n"
              "                  and win counts; the available paired results remain visible below.\n"
              "                </>\n"
              "              )}\n",
          )
          component = replace_once(
              component,
              "        it is not a claim of identical outputs. Qwen inference is stochastic.\n",
              "        it is not a claim of identical outputs. Rows without a paired comparison are marked\n"
              "        “insufficient data” and excluded from tie and win counts. Qwen inference is stochastic.\n",
          )
          component_path.write_text(component)

          test_path = Path('web/src/components/__tests__/BenchTab.test.tsx')
          tests = test_path.read_text()
          new_test = """

            it('marks missing panel comparisons as insufficient data and excludes them from tie counts', async () => {
              const incompleteFrontier: BenchResult = {
                ...frontierResult,
                panel_stats: [frontierResult.panel_stats![0]],
              }
              vi.mocked(api.bench).mockResolvedValue([benchResult, incompleteFrontier])
              render(<BenchTab />)
              const panelButton = await screen.findByRole('button', { name: /12-model frontier/i })
              fireEvent.click(panelButton)

              expect(screen.getByText(/Some solo models lack a paired comparison/i)).toBeInTheDocument()
              expect(screen.getByText('insufficient data')).toBeInTheDocument()
              expect(screen.getAllByText('ties society')).toHaveLength(1)
              expect(screen.getByText(/excluded from tie and win counts/i)).toBeInTheDocument()
            })
          """
          marker = "\n})\n"
          assert tests.endswith(marker)
          assert "marks missing panel comparisons" not in tests
          test_path.write_text(tests[:-len(marker)] + new_test + marker)
          PY

      - name: Run focused frontend validation
        working-directory: web
        run: |
          npm ci
          npm test -- --run src/components/__tests__/BenchTab.test.tsx
          npm run build

      - name: Commit fix and remove bootstrap workflow
        run: |
          rm .github/workflows/apply-frontier-comparison-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/BenchTab.tsx web/src/components/__tests__/BenchTab.test.tsx .github/workflows/apply-frontier-comparison-fix.yml
          git commit -m "fix(web): treat missing panel comparisons as unavailable"
          git push origin HEAD:${{ github.head_ref }}
