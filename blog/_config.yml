title: "Aftershock — Field Log"
description: >-
  The build journey of Aftershock — a disaster-response society of Qwen agents, named a Winner
  (Top 10 Honorable Mention Projects) in the Global AI Hackathon Series with Qwen Cloud. The claims that survived scrutiny: written doctrine lifts protocol
  conformance (credible at p=0.031; 95% on the NYC-Ida demo run) and six small models out-deliver
  one big one at ~65% better lives-per-dollar — plus the negative results, and the lives headline
  we firmed and walked back, that got us to the honest numbers.
# Publish posts even if their timestamp is ahead of the build clock (timezone-safe).
future: true
url: "https://bluntmachetti.github.io"
baseurl: "/aftershock"
author:
  name: "Kenny Ademolu"
# External links used by the nav + footer (the GitHub/Pages handle stays bluntmachetti — it is
# the account address; the displayed author name is Kenny Ademolu).
links:
  demo: "https://github.com/bluntmachetti/aftershock#quickstart"
  repo: "https://github.com/bluntmachetti/aftershock"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
# README.md is for the GitHub folder view; the live site home is index.md. No theme — the
# Field Log uses custom layouts in _layouts/ + assets/css/blog.css.
exclude:
  - README.md
