services:
  aftershock:
    build: .
    image: aftershock:latest
    expose:
      - "8788"
    ports:
      - "127.0.0.1:8788:8788"
    env_file:
      - .env            # DASHSCOPE_API_KEY=... (gitignored; required for live LLM runs)
    environment:
      OBSERVATORY_ORIGIN: ${OBSERVATORY_ORIGIN:-http://127.0.0.1:8788}
    volumes:
      - aftershock-runs:/data/runs
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - aftershock
    ports:
      - "80:80"
      - "443:443"
    environment:
      AFTERSHOCK_HOSTNAME: ${AFTERSHOCK_HOSTNAME:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  aftershock-runs:
  caddy-data:
  caddy-config:
