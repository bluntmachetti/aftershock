services:
  aftershock:
    build: .
    image: aftershock:latest
    ports:
      - "8788:8788"
    env_file:
      - .env            # DASHSCOPE_API_KEY=... (gitignored; required for live LLM runs)
    volumes:
      - aftershock-runs:/data/runs
    restart: unless-stopped

volumes:
  aftershock-runs:
